[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-repost"
version = "0.1.0"
description = "Duplicate (repost) a Kleinanzeigen listing via the internal ECG mobile API"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ka-repost = "kleinanzeigen_repost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
