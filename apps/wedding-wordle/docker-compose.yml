services:
  wedding-wordle:
    build: .
    image: wedding-wordle:latest
    container_name: wedding-wordle
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      # Set a token to enable POST /api/admin/reset (clears all players/scores).
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - wordle-data:/app/data
      # To use your own word list without rebuilding, uncomment and edit the file:
      # - ./backend/config/words.json:/app/backend/config/words.json:ro

volumes:
  wordle-data:
