# Fly.io deployment for Wedding Wordle.
# Runs the same Docker image as docker-compose, on a micro VM with a persistent
# volume for the SQLite DB. This mirrors the eventual AWS/GCloud free-tier VM
# step (EC2 t3.micro / GCE e2-micro running Docker) — no code changes to move.
#
# Deploy from inside apps/wedding-wordle/:
#   fly auth login
#   fly launch --no-deploy --copy-config --name <your-unique-name>  # registers the app
#   fly volumes create wordle_data --size 1 --region <your-region>  # persistent SQLite
#   fly secrets set ADMIN_TOKEN=<pick-a-secret>                     # enables /api/admin/reset
#   fly deploy
# Your public URL will be https://<your-unique-name>.fly.dev

app = "wedding-wordle"        # CHANGE: must be globally unique across Fly
primary_region = "fra"        # CHANGE: pick one near your venue (`fly platform regions`)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on for the wedding day so the leaderboard is instant.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Persistent disk for the SQLite file. Single machine => single volume => the
# leaderboard stays consistent. Do not scale this app past 1 machine (SQLite is
# local to the volume).
[[mounts]]
  source = "wordle_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
