<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1ea" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <title>Wedding Wordle</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Wedding&nbsp;Wordle</h1>
    <button id="leaderboard-toggle" class="lb-toggle" type="button" aria-label="Show leaderboard">🏆</button>
  </header>

  <main class="stage">
    <!-- Join screen -->
    <section id="join-screen" class="screen card hidden">
      <p class="flourish">&#10086;</p>
      <h2>Welcome!</h2>
      <p class="subtitle">Race to solve all <strong id="join-count">10</strong> wedding words.<br/>Fewest guesses &amp; fastest time wins the prize.</p>
      <form id="join-form" autocomplete="off">
        <input id="name-input" type="text" maxlength="40" placeholder="Your name" required />
        <button type="submit" class="btn-primary">Start playing</button>
      </form>
      <p id="join-error" class="error" role="alert"></p>
    </section>

    <!-- Game screen -->
    <section id="game-screen" class="screen hidden">
      <div class="progress-row">
        <span id="word-progress">Word 1 / 10</span>
        <span id="points-display">0 pts</span>
      </div>
      <div id="board" class="board" aria-label="Wordle board"></div>
      <p id="message" class="message" role="status"></p>
      <div id="keyboard" class="keyboard"></div>
    </section>

    <!-- Finish screen -->
    <section id="finish-screen" class="screen card hidden">
      <p class="flourish">&#10084;</p>
      <h2>You finished!</h2>
      <p id="finish-summary" class="subtitle"></p>
      <p class="subtitle small">See how you stack up below.</p>
    </section>
  </main>

  <!-- Leaderboard drawer -->
  <aside id="leaderboard" class="leaderboard hidden" aria-label="Leaderboard">
    <div class="lb-header">
      <h3>🏆 Leaderboard</h3>
      <button id="leaderboard-close" class="lb-close" type="button" aria-label="Close">&times;</button>
    </div>
    <ol id="leaderboard-list" class="lb-list"></ol>
    <p class="lb-foot">Updates live</p>
  </aside>
  <div id="lb-backdrop" class="lb-backdrop hidden"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
